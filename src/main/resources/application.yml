spring:
  application:
    name: InvestFeed
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/investfeed
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30
  refresh-token-expiration: 1

kiwoom:
  app-key: ${KIWOOM_APP_KEY}
  secret-key: ${KIWOOM_SECRET_KEY}
  default-url: https://api.kiwoom.com
