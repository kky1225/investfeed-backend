spring:
  application:
    name: InvestFeed
  lifecycle:
    timeout-per-shutdown-phase: 30s
  Jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/investfeed
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true   # Tomcat 스레드풀 JMX 지표 노출 (모니터링 페이지에서 조회)

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30
  refresh-token-expiration: 1

cookie:
  secure: ${COOKIE_SECURE}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

security:
  password-change-cycle: ${PASSWORD_CHANGE_CYCLE}
  default-password: ${DEFAULT_PASSWORD}
  encryption-key: ${ENCRYPTION_KEY}

scheduler:
  login-id: ${SCHEDULER_LOGIN_ID}

kiwoom:
  default-url: https://api.kiwoom.com
  mock-url: https://mockapi.kiwoom.com
  mock-appkey: ${KIWOOM_MOCK_APPKEY:}
  mock-secretkey: ${KIWOOM_MOCK_SECRETKEY:}

toss:
  default-url: https://openapi.tossinvest.com

upbit:
  default-url: https://api.upbit.com

naver-stock:
  api-url: https://api.stock.naver.com
  mobile-url: https://m.stock.naver.com
  pc-url: https://stock.naver.com
  polling-url: https://polling.finance.naver.com

naver-news:
  client-id: ${NAVER_NEWS_CLIENT_ID}
  client-secret: ${NAVER_NEWS_CLIENT_SECRET}

data-go-kr:
  default-url: https://apis.data.go.kr
  service-key: ${DATA_GO_KR_SERVICE_KEY}

ecos:
  default-url: https://ecos.bok.or.kr
  api-key: ${ECOS_API_KEY}

fred:
  default-url: https://api.stlouisfed.org
  api-key: ${FRED_API_KEY}

fear-greed:
  default-url: https://api.alternative.me

# 외부 API 호출 간격 제한 ms
external-api:
  rate-limit:
    kiwoom-interval-ms: 220          # 공식: TR당 토큰별 초당 5건 (200은 경계값이라 네트워크 지터로 429 발생 → 10% 여유)
    kiwoom-mock-interval-ms: 1000    # 공식: 모의투자 초당 1건
    kiwoom-per-token-interval-ms: 0  # 1701(전체 한도) 발생 시 조정용 예비
    fred-interval-ms: 500            # 공식: 분당 120건 (API 키 전체)
    upbit-interval-ms: 100           # 공식: IP당 그룹별 초당 10회
    toss-account-interval-ms: 1000   # 공식: ACCOUNT 그룹 초당 1회
    toss-asset-interval-ms: 200      # 공식: ASSET 그룹 초당 5회
    toss-market-info-interval-ms: 334 # 공식: MARKET_INFO 그룹 초당 3회
    toss-auth-interval-ms: 200       # 공식: AUTH 그룹 초당 5회
    log-delays-over-ms: 0            # 이 값 초과 대기 시 debug 로그 (0=끔)
    toss-429-max-retry: 3            # 토스 429 수신 시 Retry-After(없으면 1s→2s→4s+jitter) 대기 후 재시도 횟수

assistant:
  jwt:
    kid: ${ASSISTANT_JWT_KID}
    private-key: ${ASSISTANT_JWT_PRIVATE_KEY}
    expiration-seconds: 300
